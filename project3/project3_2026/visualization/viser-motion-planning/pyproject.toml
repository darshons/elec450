[project]
name = "viser-motion-planning"
version = "0.1.0"
description = "Viser-based robot, environment, and trajectory visualization toolkit"
authors = [{name = "Emiliano H Flores", email = "ef55@rice.edu"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "viser>=1.0",
    "trimesh>=4.0",
    "yourdfpy>=0.0.5",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viser_motion_planning"]
